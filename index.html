  confettiParticles.forEach(cp => {
    ctx.save();
    ctx.globalAlpha = Math.min(1, cp.life / 20);
    ctx.translate(cp.x, cp.y);
    ctx.rotate(cp.angle);
    ctx.fillStyle = cp.col;
    ctx.fillRect(-cp.w / 2, -cp.h / 2, cp.w, cp.h);
    ctx.restore();
  });

  // Top Header HUD
  ctx.fillStyle = 'rgba(16, 20, 30, 0.85)';
  ctx.fillRect(0, 0, 800, 48);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 17px sans-serif';
  ctx.fillText(`SKOR: ${score.toLocaleString()}`, 15, 30);

  ctx.fillStyle = '#ffd700';
  ctx.font = '13px sans-serif';
  ctx.fillText(`TOP: ${highscore.toLocaleString()}`, 170, 30);
  ctx.fillText(`🪙 ${player.coins}`, 290, 30);

  ctx.fillStyle = '#00e5ff';
  ctx.fillText(`JARAK: ${(distance / 1000).toFixed(2)} km`, 380, 30);

  if (eduMode === "VOCAB") {
    ctx.fillStyle = '#fcd34d';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(`📚 ${masteredWords.size}/3000 KATA`, 530, 30);
  }

  // Banner Soal Edukasi (Hanya tampil jika tidak sedang selebrasi agar rapi & tidak bertumpuk)
  const curQ = (eduMode === "VOCAB") ? vocabCurrentQuestion : mathCurrentQuestion;
  const curGate = (eduMode === "VOCAB") ? vocabActiveGate : mathActiveGate;
  if (curQ && celebrationBannerTimer <= 0 && (state === "PLAYING" || state === "PAUSED")) {
    const bW = 500, bH = 36;
    const bx = (800 - bW) / 2;
    const by = 54;

    ctx.fillStyle = 'rgba(15, 20, 34, 0.94)';
    ctx.beginPath();
    ctx.roundRect(bx, by, bW, bH, 8);
    ctx.fill();
    ctx.strokeStyle = (eduMode === "VOCAB") ? '#ffd700' : '#00e5ff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px sans-serif';
    let bannerLabel = '';
    if (eduMode === "VOCAB") {
      const isApproaching = (curGate === null);
      const prefix = isApproaching ? '🔔 SOAL BERIKUTNYA: ' : '🔤 TANTANGAN: ';
      bannerLabel = `${prefix}Apa arti "${curQ.sourceWord}"?`;
    } else {
      const isApproaching = (curGate === null);
      const prefix = isApproaching ? '🔔 SOAL BERIKUTNYA: ' : '📐 SOAL: ';
      bannerLabel = `${prefix}${curQ.text} = ?`;
    }
    ctx.fillText(bannerLabel, bx + bW / 2, by + 23);
    ctx.textAlign = 'left';
  }

  // Banner Pop-up Feedback Edukasi
  const curFbTimer = (eduMode === "VOCAB") ? vocabFeedbackTimer : mathFeedbackTimer;
  const curFbText = (eduMode === "VOCAB") ? vocabFeedbackText : mathFeedbackText;
  const curFbColor = (eduMode === "VOCAB") ? vocabFeedbackColor : mathFeedbackColor;

  if (curFbTimer > 0 && (state === "PLAYING" || state === "PAUSED")) {
    const fbW = 520, fbH = 36;
    const fx = (800 - fbW) / 2;
    const fy = 96;

    ctx.fillStyle = 'rgba(20, 25, 40, 0.95)';
    ctx.beginPath();
    ctx.roundRect(fx, fy, fbW, fbH, 8);
    ctx.fill();
    ctx.strokeStyle = curFbColor;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = curFbColor;
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(curFbText, 400, fy + 23);
    ctx.textAlign = 'left';
  }

  // 🎁 CELEBRATION BANNER — Super Reward Popup (Tampil Bersih di Tengah Layar & Anti-Truncate)
  if (celebrationBannerTimer > 0 && (state === "PLAYING" || state === "PAUSED")) {
    const alpha = Math.min(1, celebrationBannerTimer / 20);
    const scale = celebrationBannerTimer > 320 ? 1.0 + 0.03 * Math.sin(celebrationBannerTimer * 0.3) : 1.0;
    const bW = 700, bH = 120;
    const bx = (800 - bW) / 2;
    const by = 86;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(bx + bW / 2, by + bH / 2);
    ctx.scale(scale, scale);
    ctx.translate(-(bx + bW / 2), -(by + bH / 2));

    // Shadow glow
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 24;

    // Background
    ctx.fillStyle = 'rgba(10, 15, 30, 0.96)';
    ctx.beginPath();
    ctx.roundRect(bx, by, bW, bH, 14);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Gold border (double)
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(bx, by, bW, bH, 14);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,215,0,0.3)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.roundRect(bx - 3, by - 3, bW + 6, bH + 6, 16);
    ctx.stroke();

    // Helper fungsi perataan teks tengah presisi:
    // Menggunakan textAlign='left' dengan x = (800 - w)/2 agar 100% imun dari WebKit/Safari emoji alignment bug
    // Dilengkapi auto-scaling font agar kutipan panjang TIDAK AKAN PERNAH terpotong di tepi kanan!
    function drawSafeCenteredText(text, y, font, color, maxW) {
      ctx.save();
      ctx.font = font;
      let textW = ctx.measureText(text).width;
      if (textW > maxW && textW > 0) {
        const match = font.match(/(\d+(\.\d+)?)px/);
        if (match) {
          const currentSize = parseFloat(match[1]);
          const newSize = Math.max(9.5, Math.floor(currentSize * (maxW / textW) * 10) / 10);
          ctx.font = font.replace(match[0], `${newSize}px`);
          textW = ctx.measureText(text).width;
        }
      }
      const x = Math.round((800 - textW) / 2);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // Line 1: Header Nama Pemain & Skor Kata Dikuasai
    const vocabBadge = (eduMode === "VOCAB" || masteredWords.size > 0) ? ` | 📚 ${masteredWords.size}/3000 KATA` : '';
    drawSafeCenteredText(`🎁 JAWABAN TEPAT! HEBAT, ${(playerName || 'KHANSA').toUpperCase()}!${vocabBadge} 🌟`, by + 24, 'bold 16px sans-serif', '#ffd700', bW - 32);

    // Line 2: Kutipan Tokoh Dunia - Bahasa Indonesia
    const q = lastQuote || getRandomQuote();
    drawSafeCenteredText(`🇮🇩 "${q.id}"`, by + 51, 'bold 12.5px sans-serif', '#4ade80', bW - 32);

    // Line 3: Kutipan Tokoh Dunia - Bahasa Inggris & Tokoh
    drawSafeCenteredText(`🇬🇧 "${q.en}" — ${q.author}`, by + 75, 'italic 11.5px sans-serif', '#67e8f9', bW - 32);

    // Line 4: Detail Hadiah
    drawSafeCenteredText('🛡️ SHIELD KEBAL + 💰 35 KOIN + ❤️ +50 HP + ⚡ MEGA BOOST!', by + 99, 'bold 11.5px sans-serif', '#fef08a', bW - 32);

    ctx.restore();
  }

  // Bottom Dashboard
  // Ditempatkan sepenuhnya di bahu kiri jalan (x=8 s/d 152) agar TIDAK PERNAH menutupi jalur jalan atau kendaraan!
  if (state === "PLAYING") {
    const dashW = 144, dashH = 120;
    const dashX = 8, dashY = 650 - dashH - 10;
    ctx.fillStyle = 'rgba(15, 18, 28, 0.90)';
    ctx.beginPath();
    ctx.roundRect(dashX, dashY, dashW, dashH, 10);
    ctx.fill();
    ctx.strokeStyle = (player.type === "tank") ? '#fbbf24' : '#374151';
    ctx.lineWidth = 2;
    ctx.stroke();

    const speedKmh = Math.floor(player.speed * 16.5);
    ctx.fillStyle = player.isNitro ? '#00e5ff' : ((player.type === "tank") ? '#ffd700' : '#ffffff');
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${speedKmh.toString().padStart(3, '0')} km/h`, dashX + dashW / 2, dashY + 24);

    // HP Bar
    const hpRatio = Math.max(0, player.hp / player.maxHp);
    const hpColor = hpRatio > 0.4 ? '#2ecc71' : '#e74c3c';
    ctx.fillStyle = hpColor;
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('HP', dashX + 18, dashY + 50);
    ctx.fillStyle = '#262f3f';
    ctx.fillRect(dashX + 34, dashY + 40, 96, 12);
    ctx.fillStyle = hpColor;
    ctx.fillRect(dashX + 34, dashY + 40, 96 * hpRatio, 12);

    // Senjata / Nitro Bar
    if (player.type === "tank") {
      const ready = player.shootTimer <= 0;
      const cCol = ready ? '#00e5ff' : '#f59e0b';
      ctx.fillStyle = cCol;
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText(ready ? 'CAN' : 'RLD', dashX + 18, dashY + 74);
      ctx.fillStyle = '#262f3f';
      ctx.fillRect(dashX + 34, dashY + 64, 96, 12);
      const reloadRatio = ready ? 1 : (1 - player.shootTimer / (player.data.cannonCooldown || 20));
      ctx.fillStyle = cCol;
      ctx.fillRect(dashX + 34, dashY + 64, 96 * reloadRatio, 12);
    } else {
      const nRatio = Math.max(0, player.nitro / player.maxNitro);
      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText('N2O', dashX + 18, dashY + 74);
      ctx.fillStyle = '#262f3f';
      ctx.fillRect(dashX + 34, dashY + 64, 96, 12);
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(dashX + 34, dashY + 64, 96 * nRatio, 12);
    }

    // Super Shield Timer Bar or Player Name
    if (player.superShieldTimer > 0) {
      const shieldRatio = player.superShieldTimer / 420;
      const shieldHue = Math.floor((Date.now() / 20) % 360);
      ctx.fillStyle = `hsl(${shieldHue}, 100%, 50%)`;
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText('🛡️ KEBAL', dashX + dashW / 2, dashY + 95);
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(dashX + 14, dashY + 102, 116, 8);
      ctx.fillStyle = `hsl(${shieldHue}, 100%, 55%)`;
      ctx.fillRect(dashX + 14, dashY + 102, 116 * shieldRatio, 8);
    } else {
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(`👤 ${playerName || 'Khansa'}`, dashX + dashW / 2, dashY + 102);
    }
    ctx.textAlign = 'left';
  }

  // Screens Overlay
  if (state === "MENU") {
    ctx.fillStyle = 'rgba(10, 12, 18, 0.88)';
    ctx.fillRect(0, 0, 800, 650);

    // Top Profile Badge
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    const curCoins = (typeof player !== 'undefined' && player) ? player.coins : playerCoins;
    const mCnt = masteredWords.size;
    ctx.fillText(`👤 PEMBALAP: ${(playerName || 'Khansa').toUpperCase()}   |   📚 ${mCnt} KATA DIKUASAI   |   🪙 ${curCoins} KOIN   |   🏆 REKOR: ${highscore.toLocaleString()}`, 400, 20);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText('MOBIL LEGEND', 400, 48);

    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('— KHANSA RACING & EDUKASI MATEMATIKA & INGGRIS —', 400, 72);

    // --- Tab Pilihan Mata Pelajaran Edukasi ---
    const isMath = (eduMode === "MATH");
    // Tab Matematika
    ctx.fillStyle = isMath ? 'rgba(30, 60, 95, 0.95)' : 'rgba(20, 24, 34, 0.8)';
    ctx.beginPath();
    ctx.roundRect(190, 88, 195, 30, 6);
    ctx.fill();
    ctx.strokeStyle = isMath ? '#00e5ff' : '#374151';
    ctx.lineWidth = isMath ? 2 : 1;
    ctx.stroke();
    ctx.fillStyle = isMath ? '#ffffff' : '#94a3b8';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('📐 MATEMATIKA SD', 287, 108);

    // Tab English Vocab
    ctx.fillStyle = !isMath ? 'rgba(75, 55, 20, 0.95)' : 'rgba(20, 24, 34, 0.8)';
    ctx.beginPath();
    ctx.roundRect(415, 88, 195, 30, 6);
    ctx.fill();
    ctx.strokeStyle = !isMath ? '#ffd700' : '#374151';
    ctx.lineWidth = !isMath ? 2 : 1;
    ctx.stroke();
    ctx.fillStyle = !isMath ? '#ffffff' : '#94a3b8';
    ctx.fillText('🔤 ENGLISH 3000 VOCAB', 512, 108);

    // --- Tab Pilihan Tingkat Kelas / Level (Edukasi Adaptif) ---
    const curLvl = isMath ? gradeLevel : vocabLevel;
    const levelsMap = isMath ? MATH_GRADES : VOCAB_LEVELS;
    const gradeTabs = [
      { lvl: 1, x: 165, y: 124, w: 150, h: 30 },
      { lvl: 2, x: 325, y: 124, w: 150, h: 30 },
      { lvl: 3, x: 485, y: 124, w: 150, h: 30 }
    ];

    gradeTabs.forEach(tab => {
      const isSel = (tab.lvl === curLvl);
      ctx.fillStyle = isSel ? (tab.lvl === 1 ? 'rgba(35, 80, 55, 0.95)' : (tab.lvl === 2 ? 'rgba(75, 65, 30, 0.95)' : 'rgba(25, 55, 80, 0.95)')) : 'rgba(22, 26, 38, 0.75)';
      ctx.beginPath();
      ctx.roundRect(tab.x, tab.y, tab.w, tab.h, 6);
      ctx.fill();
      ctx.strokeStyle = isSel ? (tab.lvl === 1 ? '#4ade80' : (tab.lvl === 2 ? '#fcd34d' : '#38bdf8')) : '#374151';
      ctx.lineWidth = isSel ? 2 : 1;
      ctx.stroke();

      ctx.fillStyle = isSel ? '#ffffff' : '#94a3b8';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(levelsMap[tab.lvl].badge, tab.x + tab.w / 2, tab.y + 19);
    });

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '12px sans-serif';
    const subDesc = isMath ? `Materi: ${MATH_GRADES[gradeLevel].desc}` : `Fokus: ${VOCAB_LEVELS[vocabLevel].desc} (Target 3.000 Kata)`;
    ctx.fillText(subDesc, 400, 168);

    const curVeh = CARS_DATA[selectedCarKey];
    const isTank = curVeh.type === "tank";

    // 1. Tab Pilihan Kategori Mobil vs Tank
    // Tab Mobil
    ctx.fillStyle = !isTank ? 'rgba(24, 75, 140, 0.9)' : 'rgba(25, 30, 42, 0.7)';
    ctx.beginPath();
    ctx.roundRect(190, 155, 200, 36, 8);
    ctx.fill();
    ctx.strokeStyle = !isTank ? '#00e5ff' : '#3c4866';
    ctx.lineWidth = !isTank ? 2 : 1;
    ctx.stroke();
    ctx.fillStyle = !isTank ? '#ffffff' : '#94a3b8';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('🏎️ PILIH MOBIL', 290, 178);

    // Tab Tank
    ctx.fillStyle = isTank ? 'rgba(45, 100, 40, 0.9)' : 'rgba(25, 30, 42, 0.7)';
    ctx.beginPath();
    ctx.roundRect(410, 155, 200, 36, 8);
    ctx.fill();
    ctx.strokeStyle = isTank ? '#fbbf24' : '#3c4866';
    ctx.lineWidth = isTank ? 2 : 1;
    ctx.stroke();
    ctx.fillStyle = isTank ? '#ffffff' : '#94a3b8';
    ctx.fillText('🛡️ PILIH TANK', 510, 178);

    // 2. Tombol Panah Kiri (◀) dan Kanan (▶)
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.roundRect(125, 245, 52, 70, 8);
    ctx.roundRect(623, 245, 52, 70, 8);
    ctx.fill();
    ctx.strokeStyle = curVeh.glow;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText('◀', 151, 289);
    ctx.fillText('▶', 649, 289);

    // 3. Kartu Kendaraan
    ctx.fillStyle = 'rgba(25, 32, 48, 0.95)';
    ctx.beginPath();
    ctx.roundRect(195, 200, 410, 210, 12);
    ctx.fill();
    ctx.strokeStyle = curVeh.glow;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Badge Kategori
    ctx.fillStyle = isTank ? '#4ade80' : '#38bdf8';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(isTank ? '🛡️ KATEGORI: BATTLE TANK' : '🏎️ KATEGORI: RACING CAR', 400, 226);

    // Nama Kendaraan
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(curVeh.name, 400, 255);

    // Stats bar mini
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(`Kecepatan: ${Math.round(curVeh.maxSpeed * 15)} km/h   |   Armor: ${curVeh.maxHp} HP`, 400, 288);
    ctx.fillStyle = isTank ? '#fbbf24' : '#00e5ff';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(isTank ? '💣 Senjata: Meriam Blast (Hancurkan Musuh)' : '⚡ Kemampuan: Turbo Nitro Rocket Boost', 400, 318);

    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(curVeh.description, 400, 350);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`🏆 REKOR TERTINGGI: ${highscore.toLocaleString()}`, 400, 432);

    // 4. Tombol Mulai
    ctx.fillStyle = '#e6232d';
    ctx.beginPath();
    ctx.roundRect(220, 468, 360, 46, 8);
    ctx.fill();
    ctx.strokeStyle = '#fcd34d';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(`▶ MULAI MAIN & BELAJAR`, 400, 497);

    // 4 Tombol Menu Aksi (Nama, Reset, Mode, Garasi)
    const btnBarY = 524;
    const actionBtns = [
      { label: "✏️ [N] Nama", x: 140, w: 115, col: '#1e3a5f' },
      { label: "🗑️ [DEL] Reset", x: 265, w: 115, col: '#451a20' },
      { label: "🔄 [E] Mode", x: 390, w: 115, col: '#1e3d30' },
      { label: "🏎️ [G] Garasi", x: 515, w: 115, col: '#2a324b' }
    ];
    actionBtns.forEach(btn => {
      ctx.fillStyle = btn.col;
      ctx.beginPath();
      ctx.roundRect(btn.x, btnBarY, btn.w, 30, 6);
      ctx.fill();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(btn.label, btn.x + btn.w / 2, btnBarY + 19);
    });

    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px sans-serif';
    ctx.fillText(`Halo ${playerName || 'Khansa'}! Lewati Gerbang Jawaban Benar untuk Hadiah Super Selebrasi & Pelindung Kebal!`, 400, 574);
    ctx.textAlign = 'left';
  } else if (state === "GARAGE") {
    ctx.fillStyle = '#0f121a';
    ctx.fillRect(0, 0, 800, 650);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 34px sans-serif';
    ctx.fillText('GARASI KENDARAAN: PILIH MOBIL / TANK', 400, 65);

    const cardW = 140;
    const gap = 12;
    const startX = Math.floor((800 - (carKeys.length * cardW + (carKeys.length - 1) * gap)) / 2);

    carKeys.forEach((key, idx) => {
      const d = CARS_DATA[key];
      const isSel = idx === garageIdx;
      const isTank = d.type === "tank";
      const x = startX + idx * (cardW + gap);
      const y = 110;

      ctx.fillStyle = isSel ? 'rgba(30, 42, 65, 0.95)' : 'rgba(20, 25, 36, 0.7)';
      ctx.beginPath();
      ctx.roundRect(x, y, cardW, 370, 10);
      ctx.fill();
      ctx.strokeStyle = isSel ? d.glow : '#334155';
      ctx.lineWidth = isSel ? 3 : 1;
      ctx.stroke();

      // Badge Kategori
      ctx.fillStyle = isTank ? '#16a34a' : '#0284c7';
      ctx.beginPath();
      ctx.roundRect(x + 15, y + 12, cardW - 30, 22, 11);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(isTank ? '🛡️ TANK' : '🏎️ MOBIL', x + cardW / 2, y + 27);

      // Nama Kendaraan
      ctx.fillStyle = isSel ? '#ffffff' : '#cbd5e1';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(d.name, x + cardW / 2, y + 58);

      // Gambar Ikon Kendaraan Mini
      const cx = x + cardW / 2;
      const cy = y + 120;
      if (isTank) {
        // Tank Treads
        ctx.fillStyle = '#1c1e20';
        ctx.fillRect(cx - 24, cy - 25, 10, 50);
        ctx.fillRect(cx + 14, cy - 25, 10, 50);
        // Tank Hull
        ctx.fillStyle = d.primary;
        ctx.fillRect(cx - 15, cy - 22, 30, 44);
        // Barrel
        ctx.fillStyle = '#475569';
        ctx.fillRect(cx - 3, cy - 40, 6, 22);
        // Turret
        ctx.fillStyle = d.stripe || '#334155';
        ctx.beginPath();
        ctx.arc(cx, cy, 11, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Car Body
        ctx.fillStyle = d.primary;
        ctx.beginPath();
        ctx.roundRect(cx - 16, cy - 28, 32, 56, 6);
        ctx.fill();
        // Stripe
        ctx.fillStyle = d.stripe;
        ctx.fillRect(cx - 3, cy - 26, 6, 52);
        // Windshield
        ctx.fillStyle = '#1c2838';
        ctx.fillRect(cx - 11, cy - 14, 22, 10);
      }

      // Stats
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`Kec: ${Math.round(d.maxSpeed * 15)} km/h`, cx, y + 195);
      ctx.fillText(`Armor: ${d.maxHp} HP`, cx, y + 225);
      ctx.fillText(`Lincah: ${d.handling}`, cx, y + 255);

      // Spesial Skill
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = isTank ? '#fbbf24' : '#38bdf8';
      ctx.fillText(isTank ? '💣 Meriam Blast' : '⚡ Turbo Nitro', cx, y + 290);

      if (isSel) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('▶ TERPILIH ◀', cx, y + 340);
      }
    });

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('[PANAH KIRI / KANAN] Pilih Kendaraan   |   [ENTER / SPACE] Main   |   [ESC] Menu', 400, 530);
    ctx.textAlign = 'left';
  } else if (state === "PAUSED") {
    ctx.fillStyle = 'rgba(10, 12, 20, 0.75)';
    ctx.fillRect(0, 0, 800, 650);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText('PAUSE', 400, 280);
    ctx.fillStyle = '#00e5ff';
    ctx.font = '18px sans-serif';
    ctx.fillText('Tekan [P] atau [ESC] untuk lanjut', 400, 330);
    ctx.textAlign = 'left';
  } else if (state === "GAMEOVER") {
    ctx.fillStyle = 'rgba(18, 10, 15, 0.92)';
    ctx.fillRect(0, 0, 800, 650);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4d4d';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText(player.type === 'tank' ? 'TANK HANCUR!' : 'MOBIL HANCUR!', 400, 70);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('GAME OVER', 400, 98);

    if (isNewRecord) {
      ctx.fillStyle = '#ffeb3b';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('🎉 REKOR SKOR BARU! 🎉', 400, 126);
    }

    // Kartu Kiri: Hasil Balapan
    ctx.fillStyle = 'rgba(28, 24, 34, 0.92)';
    ctx.beginPath();
    ctx.roundRect(110, 145, 275, 240, 12);
    ctx.fill();
    ctx.strokeStyle = '#64384a';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 17px sans-serif';
    ctx.fillText('🏁 HASIL BALAPAN', 247, 178);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(`Skor: ${score.toLocaleString()}`, 247, 218);

    ctx.fillStyle = '#00e5ff';
    ctx.font = '14px sans-serif';
    ctx.fillText(`Jarak: ${(distance / 1000).toFixed(2)} km`, 247, 258);

    ctx.fillStyle = '#ffd700';
    ctx.fillText(`Koin: ${player.coins} koin`, 247, 292);

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '12px sans-serif';
    ctx.fillText(`Top Skor: ${highscore.toLocaleString()}`, 247, 345);

    // Kartu Kanan: Rapor Edukasi (Matematika atau Vocab)
    ctx.fillStyle = 'rgba(20, 32, 48, 0.94)';
    ctx.beginPath();
    ctx.roundRect(415, 145, 275, 240, 12);
    ctx.fill();
    ctx.strokeStyle = (eduMode === "VOCAB") ? '#ffd700' : '#00e5ff';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (eduMode === "VOCAB") {
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText('📚 RAPOR KOSA KATA', 552, 178);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px sans-serif';
      ctx.fillText(VOCAB_LEVELS[vocabLevel].badge, 552, 206);

      ctx.fillStyle = '#4ade80';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(`Benar: ${vocabCorrectAnswers} / ${vocabTotalQuestions} Kata`, 552, 236);

      const acc = vocabTotalQuestions > 0 ? Math.round((vocabCorrectAnswers / vocabTotalQuestions) * 100) : 100;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(`Akurasi: ${acc}%`, 552, 268);

      const stars = acc >= 80 ? '⭐⭐⭐' : (acc >= 50 ? '⭐⭐' : '⭐');
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(stars, 552, 304);

      const title = acc >= 80 ? '🌟 VOCABULARY MASTER KHANSA 🌟' : (acc >= 50 ? '⭐ ENGLISH STAR KHANSA ⭐' : '🌱 ENGLISH EXPLORER 🌱');
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#fcd34d';
      ctx.fillText(title, 552, 335);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`🎯 Dikuasai: ${masteredWords.size} / 3.000 Kata`, 552, 360);
    } else {
      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText('📊 RAPOR MATEMATIKA', 552, 178);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px sans-serif';
      ctx.fillText(MATH_GRADES[gradeLevel].badge, 552, 206);

      ctx.fillStyle = '#4ade80';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(`Benar: ${mathCorrectAnswers} / ${mathTotalQuestions} Soal`, 552, 236);

      const acc = mathTotalQuestions > 0 ? Math.round((mathCorrectAnswers / mathTotalQuestions) * 100) : 100;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(`Akurasi: ${acc}%`, 552, 268);

      const stars = acc >= 80 ? '⭐⭐⭐' : (acc >= 50 ? '⭐⭐' : '⭐');
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(stars, 552, 304);

      const title = acc >= 80 ? '🌟 PROFESOR CILIK KHANSA 🌟' : (acc >= 50 ? '⭐ BINTANG MATEMATIKA HEBAT ⭐' : '🌱 PENJELAJAH MATEMATIKA MUDA 🌱');
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#fcd34d';
      ctx.fillText(title, 552, 345);
    }

    // Tombol Main Lagi
    ctx.fillStyle = '#e6232d';
    ctx.beginPath();
    ctx.roundRect(240, 425, 320, 48, 8);
    ctx.fill();
    ctx.strokeStyle = '#fcd34d';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('TEKAN [SPACE] UNTUK MAIN LAGI', 400, 455);

    ctx.fillStyle = '#8c9bb0';
    ctx.font = '13px sans-serif';
    ctx.fillText('[M] Menu Utama   |   [G] Ganti Mobil / Tank', 400, 505);
    ctx.textAlign = 'left';
  }
}

// Start game loop
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
