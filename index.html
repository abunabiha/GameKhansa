<!DOCTYPE html>

<head>

      margin: 0;
      padding: 0;

      -webkit-user-select: none;

      background: #0d0f17;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

      align-items: center;
      justify-content: center;
      min-height: 100vh;

    #game-container {

      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 230, 255, 0.2);
      border-radius: 12px;

      border: 2px solid #2a3147;
      display: flex;

      justify-content: center;

      display: block;

    #game-container:fullscreen,
    #game-container:-webkit-full-screen,
    #game-container.is-fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: #05070a !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    #game-container:fullscreen canvas,
    #game-container:-webkit-full-screen canvas,
    #game-container.is-fullscreen canvas {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: min(100vw, calc(100vh * (800 / 650))) !important;
      height: min(100vh, calc(100vw * (650 / 800))) !important;
      aspect-ratio: 800 / 650 !important;
      object-fit: contain !important;
      margin: auto !important;
      display: block !important;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 30px rgba(0, 229, 255, 0.15) !important;
    }
    .top-controls {
      position: absolute;
      top: 10px;
      right: 14px;
      z-index: 10000;
      display: flex;
      gap: 8px;
    }
    .fs-btn {
      height: 34px;
      background: rgba(18, 25, 42, 0.92);
      color: #00e5ff;
      border: 1.5px solid #00e5ff;
      border-radius: 6px;
      padding: 0 14px;
      font-size: 12px;

      cursor: pointer;

      display: none;
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;

    .touch-btn {
      pointer-events: auto;
      background: rgba(20, 25, 40, 0.75);

<script>
// --- Web Audio Synthesizer (Prosedural Lengkap: Mesin Mobil, Ban, Nitro, BGM) ---
class WebAudioSFX {
  constructor() {
    this.ctx = null;
    this.engineOsc = null;
    this.engineGain = null;
    this.engineFilter = null;
    
    this.nitroNoise = null;
    this.nitroGain = null;
    this.nitroFilter = null;

    this.bgmPlaying = false;
    this.bgmTimer = null;
    this.bgmStep = 0;
    this.screechCooldown = 0;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }

    if (!this.engineOsc && this.ctx) {
      // 1. Synthesizer Mesin Mobil (Sawtooth + Lowpass Filter)
      this.engineOsc = this.ctx.createOscillator();
      this.engineOsc.type = 'sawtooth';
      this.engineOsc.frequency.setValueAtTime(52, this.ctx.currentTime);

      this.engineFilter = this.ctx.createBiquadFilter();
      this.engineFilter.type = 'lowpass';
      this.engineFilter.frequency.setValueAtTime(420, this.ctx.currentTime);

      this.engineGain = this.ctx.createGain();
      this.engineGain.gain.setValueAtTime(0.0001, this.ctx.currentTime);

      this.engineOsc.connect(this.engineFilter);
      this.engineFilter.connect(this.engineGain);
      this.engineGain.connect(this.ctx.destination);
      this.engineOsc.start();

      // 2. Synthesizer Nitro Rocket Jet
      const bufferSize = this.ctx.sampleRate * 2;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      this.nitroNoise = this.ctx.createBufferSource();
      this.nitroNoise.buffer = noiseBuffer;
      this.nitroNoise.loop = true;

      this.nitroFilter = this.ctx.createBiquadFilter();
      this.nitroFilter.type = 'bandpass';
      this.nitroFilter.frequency.setValueAtTime(650, this.ctx.currentTime);
      this.nitroFilter.Q.setValueAtTime(2.0, this.ctx.currentTime);

      this.nitroGain = this.ctx.createGain();
      this.nitroGain.gain.setValueAtTime(0.0001, this.ctx.currentTime);

      this.nitroNoise.connect(this.nitroFilter);
      this.nitroFilter.connect(this.nitroGain);
      this.nitroGain.connect(this.ctx.destination);
      this.nitroNoise.start();

      // 3. Mulai Musik Arcade Retro BGM
      this.startBgm();
    }
  }

  updateEngine(speed, maxSpeed, isNitro, isGas, isBrake, vehicleType = 'car') {
    if (!this.ctx || !this.engineOsc) return;
    const now = this.ctx.currentTime;
    const ratio = Math.max(0, Math.min(1, speed / maxSpeed));

    const isTank = vehicleType === 'tank';
    const baseFreq = isTank ? 36 : 50;
    const freqRange = isTank ? 65 : 155;

    // Hitung frekuensi raungan mesin sesuai kecepatan & injakan gas
    let targetFreq = baseFreq + ratio * freqRange;
    if (isGas) targetFreq += isTank ? 12 : 22;
    if (isNitro && speed > 2) targetFreq += 85;
    if (isBrake) targetFreq = Math.max(isTank ? 30 : 45, targetFreq - 20);

    let targetVol = (isTank ? 0.12 : 0.08) + ratio * 0.18;
    if (isGas) targetVol += 0.06;
    if (isNitro && speed > 2) targetVol += 0.12;

    this.engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.06);
    this.engineFilter.frequency.setTargetAtTime(isTank ? (200 + ratio * 280) : (320 + ratio * 450), now, 0.08);
    this.engineGain.gain.setTargetAtTime(targetVol, now, 0.06);

    // Suara deru roket Nitro
    const nitroVol = (isNitro && speed > 2) ? 0.22 : 0.0001;
    this.nitroGain.gain.setTargetAtTime(nitroVol, now, 0.05);
  }

  stopEngine() {
    if (!this.ctx || !this.engineGain) return;
    const now = this.ctx.currentTime;
    this.engineGain.gain.setTargetAtTime(0.0001, now, 0.08);
    if (this.nitroGain) this.nitroGain.gain.setTargetAtTime(0.0001, now, 0.05);
  }

  playScreech() {
    if (!this.ctx || Date.now() - this.screechCooldown < 250) return;
    this.screechCooldown = Date.now();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(1050, now);
    osc.frequency.linearRampToValueAtTime(800, now + 0.25);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  }

  startBgm() {
    if (this.bgmPlaying || !this.ctx) return;
    this.bgmPlaying = true;
    const bpm = 132;
    const stepInterval = (60 / bpm / 4) * 1000;
    const bassNotes = [110.0, 110.0, 130.81, 146.83, 110.0, 110.0, 164.81, 146.83];

    this.bgmTimer = setInterval(() => {
      if (!this.ctx || !this.bgmPlaying) return;
      const now = this.ctx.currentTime;

      // Kick drum pada beat ke 0, 4, 8, 12
      if (this.bgmStep % 4 === 0) {
        const kickOsc = this.ctx.createOscillator();
        const kickGain = this.ctx.createGain();
        kickOsc.frequency.setValueAtTime(130, now);
        kickOsc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
        kickGain.gain.setValueAtTime(0.25, now);
        kickGain.gain.linearRampToValueAtTime(0.001, now + 0.15);
        kickOsc.connect(kickGain);
        kickGain.connect(this.ctx.destination);
        kickOsc.start(now);
        kickOsc.stop(now + 0.15);
      }

      // Snare drum pada beat ke 4 dan 12 (beat 2 & 4 dalam 4/4)
      if (this.bgmStep % 8 === 4) {
        const snareOsc = this.ctx.createOscillator();
        const snareGain = this.ctx.createGain();
        snareOsc.type = 'triangle';
        snareOsc.frequency.setValueAtTime(190, now);
        snareGain.gain.setValueAtTime(0.15, now);
        snareGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        snareOsc.connect(snareGain);
        snareGain.connect(this.ctx.destination);
        snareOsc.start(now);
        snareOsc.stop(now + 0.12);
      }

      // 16th-note Synthesizer Bassline
      const noteFreq = bassNotes[this.bgmStep % bassNotes.length];
      const bassOsc = this.ctx.createOscillator();
      const bassGain = this.ctx.createGain();
      bassOsc.type = 'sawtooth';
      bassOsc.frequency.setValueAtTime(noteFreq, now);
      bassGain.gain.setValueAtTime(0.08, now);
      bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      bassOsc.connect(bassGain);
      bassGain.connect(this.ctx.destination);
      bassOsc.start(now);
      bassOsc.stop(now + 0.11);

      this.bgmStep = (this.bgmStep + 1) % 16;
    }, stepInterval);
  }

  stopBgm() {
    this.bgmPlaying = false;
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
    }
  }

  toggleBgm() {
    if (this.bgmPlaying) this.stopBgm();
    else this.startBgm();
  }
  playCoin() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, now);
    osc.frequency.setValueAtTime(1318.51, now + 0.08);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.22);
  }
  playNitro() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(580, now + 0.3);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  }
  playCrash() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.linearRampToValueAtTime(40, now + 0.4);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  }
  playRepair() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.25);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  }
  playCannon() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.35);
    gain.gain.setValueAtTime(0.65, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  }
  playExplosion() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(95, now);
    osc.frequency.linearRampToValueAtTime(25, now + 0.5);
    gain.gain.setValueAtTime(0.7, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.5);
  }
  playMathCorrect() {
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    const now = this.ctx.currentTime;
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.07);
      gain.gain.setValueAtTime(0.22, now + idx * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.16);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.07);
      osc.stop(now + idx * 0.07 + 0.16);
    });
  }
  playMathWrong() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.linearRampToValueAtTime(140, now + 0.25);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  }
  playBarrierBlock() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.linearRampToValueAtTime(100, now + 0.22);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.22);
  }
  playVictoryFanfare() {
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
    const now = this.ctx.currentTime;
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.08);
      gain.gain.setValueAtTime(0.25, now + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.08);
      osc.stop(now + idx * 0.08 + 0.22);
    });
  }
  playCoinCascade() {
    if (!this.ctx) return;
    const notes = [987.77, 1318.51, 1567.98, 1760.00, 2093.00, 2637.02];
    const now = this.ctx.currentTime;
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.05);
      gain.gain.setValueAtTime(0.2, now + idx * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.14);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.05);
      osc.stop(now + idx * 0.05 + 0.14);
    });
  }
}

const sfx = new WebAudioSFX();

// --- Konfigurasi & Variabel Game ---
const canvas = document.getElementById('gameCanvas');

const NUM_LANES = 4;
const LANE_WIDTH = ROAD_WIDTH / NUM_LANES;
const LANE_CENTERS = [0, 1, 2, 3].map(i => ROAD_LEFT + (i + 0.5) * LANE_WIDTH);

// --- Modul Edukasi Matematika Anak SD (Kelas 1 - 6) ---
const MATH_GRADES = {
  1: { badge: "🌱 KELAS 1-2 SD", title: "Pemula", desc: "Tambah & Kurang (1 - 20)" },
  2: { badge: "⭐ KELAS 3-4 SD", title: "Menengah", desc: "Perkalian (1-10) & Pembagian" },

};

let gradeLevel = 2;
let mathCurrentQuestion = null;
let mathActiveGate = null;
let mathSpawnTimer = 180;
const mathSpawnInterval = 520;
let mathFeedbackText = "";
let mathFeedbackColor = "#ffd700";
let mathFeedbackTimer = 0;

let mathCorrectAnswers = 0;

// Selebrasi Hadiah Edukasi (Konfeti & Pop-up Banner)
let confettiParticles = [];
let celebrationBannerTimer = 0;

function spawnConfettiBurst() {
  for (let i = 0; i < 50; i++) {
    confettiParticles.push({
      x: ROAD_LEFT - 20 + Math.random() * (ROAD_WIDTH + 40),
      y: -30 + Math.random() * 120,
      vx: (Math.random() - 0.5) * 5,
      vy: Math.random() * 4 + 3.5,
      w: Math.random() * 6 + 7,
      h: Math.random() * 4 + 5,
      angle: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.25,
      col: ['#ffd700', '#00e5ff', '#ff4081', '#2ecc71', '#ff9100', '#ffffff'][Math.floor(Math.random() * 6)],
      life: Math.floor(Math.random() * 50) + 75
    });
  }
}

function generateMathQuestion(grade) {
  let text = "", ans = 0;
  if (grade === 1) {
    const op = Math.random() < 0.5 ? "+" : "-";
    if (op === "+") {
      const a = Math.floor(Math.random() * 12) + 1;
      const b = Math.floor(Math.random() * 10) + 1;
      text = `${a} + ${b} = ?`;
      ans = a + b;
    } else {
      const a = Math.floor(Math.random() * 17) + 4;
      const b = Math.floor(Math.random() * a) + 1;
      text = `${a} - ${b} = ?`;
      ans = a - b;
    }
  } else if (grade === 3) {
    const mode = Math.random();
    if (mode < 0.35) {
      const a = Math.floor(Math.random() * 12) + 4;
      const b = Math.floor(Math.random() * 8) + 2;
      const c = Math.floor(Math.random() * 15) + 1;
      text = `${a} x ${b} - ${c} = ?`;
      ans = a * b - c;
    } else if (mode < 0.7) {
      const b = Math.floor(Math.random() * 8) + 4;
      const ansDiv = Math.floor(Math.random() * 15) + 6;
      const a = b * ansDiv;
      text = `${a} : ${b} = ?`;
      ans = ansDiv;
    } else {
      const a = Math.floor(Math.random() * 12) + 2;
      const b = Math.floor(Math.random() * 10) + 1;
      const c = Math.floor(Math.random() * 5) + 2;
      text = `(${a} + ${b}) x ${c} = ?`;
      ans = (a + b) * c;
    }
  } else {
    // Grade 2 (Kelas 3-4)
    const opChoice = Math.random();
    if (opChoice < 0.35) {
      const a = Math.floor(Math.random() * 9) + 2;
      const b = Math.floor(Math.random() * 9) + 2;
      text = `${a} x ${b} = ?`;
      ans = a * b;
    } else if (opChoice < 0.65) {
      const b = Math.floor(Math.random() * 8) + 2;
      const ansDiv = Math.floor(Math.random() * 9) + 2;
      const a = b * ansDiv;
      text = `${a} : ${b} = ?`;
      ans = ansDiv;
    } else if (opChoice < 0.85) {
      const a = Math.floor(Math.random() * 45) + 10;
      const b = Math.floor(Math.random() * 45) + 10;
      text = `${a} + ${b} = ?`;
      ans = a + b;
    } else {
      const a = Math.floor(Math.random() * 50) + 30;
      const b = Math.floor(Math.random() * (a - 15)) + 10;
      text = `${a} - ${b} = ?`;
      ans = a - b;
    }
  }

  const options = [ans];
  const deltas = [-3, -2, -1, 1, 2, 3, 5, 10];
  while (options.length < NUM_LANES) {
    const d = deltas[Math.floor(Math.random() * deltas.length)];
    const wrong = ans + d;
    if (wrong >= 0 && !options.includes(wrong)) {
      options.push(wrong);
    }
  }
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }

  return { text, correctAnswer: ans, options };
}

function generateVocabQuestion(lvl) {
  const pool = VOCAB_BY_LEVEL[lvl] && VOCAB_BY_LEVEL[lvl].length >= 4 ? VOCAB_BY_LEVEL[lvl] : VOCAB_RAW.map(x => ({ en: x[0], id: x[1], level: x[2] }));
  const target = pool[Math.floor(Math.random() * pool.length)];
  const isEnToId = Math.random() < 0.65; // Dominan Tebak Bahasa Indonesia

  let text = "", correctAnswer = "", sourceWord = "";
  const optionsSet = new Set();

  if (isEnToId) {
    const enWord = target.en.charAt(0).toUpperCase() + target.en.slice(1);
    let idWord = target.id;
    if (idWord.length > 15) idWord = idWord.split(' ')[0];
    idWord = idWord.charAt(0).toUpperCase() + idWord.slice(1);

    sourceWord = enWord;
    correctAnswer = idWord;
    text = "Arti kata: '" + enWord.toUpperCase() + "' ?";
    optionsSet.add(correctAnswer);

    let tries = 0;
    while (optionsSet.size < NUM_LANES && tries < 60) {
      tries++;
      const cand = pool[Math.floor(Math.random() * pool.length)];
      let w = cand.id;
      if (w.length > 15) w = w.split(' ')[0];
      w = w.charAt(0).toUpperCase() + w.slice(1);
      optionsSet.add(w);
    }
  } else {
    let idWord = target.id;
    if (idWord.length > 15) idWord = idWord.split(' ')[0];
    idWord = idWord.charAt(0).toUpperCase() + idWord.slice(1);
    const enWord = target.en.charAt(0).toUpperCase() + target.en.slice(1);

    sourceWord = idWord;
    correctAnswer = enWord;
    text = "B. Inggris: '" + idWord.toUpperCase() + "' ?";
    optionsSet.add(correctAnswer);

    let tries = 0;
    while (optionsSet.size < NUM_LANES && tries < 60) {
      tries++;
      const cand = pool[Math.floor(Math.random() * pool.length)];
      const w = cand.en.charAt(0).toUpperCase() + cand.en.slice(1);
      optionsSet.add(w);
    }
  }

  const options = Array.from(optionsSet);
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }

  return { text, correctAnswer, options, sourceWord, isEnToId };
}

function generateNewVocabQuestion() {
  vocabCurrentQuestion = generateVocabQuestion(vocabLevel);
}

function toggleFullScreen() {
  const container = document.getElementById('game-container');
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);

  if (!isFs) {
    if (container.requestFullscreen) {
      container.requestFullscreen();
    } else if (container.webkitRequestFullscreen) {
      container.webkitRequestFullscreen();
    } else if (container.mozRequestFullScreen) {
      container.mozRequestFullScreen();
    } else if (container.msRequestFullscreen) {
      container.msRequestFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.mozCancelFullScreen) {
      document.mozCancelFullScreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }
  }
}

function updateFullscreenUI() {
  const container = document.getElementById('game-container');
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  
  if (container) {
    if (isFs) {
      container.classList.add('is-fullscreen');
    } else {
      container.classList.remove('is-fullscreen');
    }
  }

  const fsText = document.getElementById('fs-text');
  const fsIcon = document.getElementById('fs-icon');
  if (fsText && fsIcon) {
    if (isFs) {
      fsText.innerText = "Keluar Layar Penuh";
      fsIcon.innerText = "✖";
    } else {
      fsText.innerText = "Layar Penuh";
      fsIcon.innerText = "⛶";
    }
  }
}

      playerName = inputNameText.trim() || "Khansa";
      savePlayerProfile();
      state = "MENU";
      sfx.playCoin();
    }
  } else if (state === "CONFIRM_DELETE") {
    // Tombol "YA, HAPUS DATA" (400-190=210 s/d 385, by=cardY+160 ~ 355..400)
    if (mx >= 210 && mx <= 385 && my >= 350 && my <= 405) {
      deletePlayerProfile();
      sfx.playCrash();
    }
    // Tombol "BATAL" (400+15=415 s/d 590, by=cardY+160 ~ 355..400)
    else if (mx >= 415 && mx <= 590 && my >= 350 && my <= 405) {
      state = "MENU";
    }
  } else if (state === "MENU") {
    // Top profile badge click -> ganti nama
    if (my >= 6 && my <= 32 && mx >= 150 && mx <= 650) {
      inputNameText = playerName;
      state = "NAME_INPUT";
    }
    // Action bar buttons di bawah layar menu:
    // [N] Ganti Nama (mx 140..255, my 522..555)
    else if (mx >= 140 && mx <= 255 && my >= 522 && my <= 555) {
      inputNameText = playerName;
      state = "NAME_INPUT";
      sfx.playCoin();
    }
    // [DEL] Hapus Data (mx 265..380, my 522..555)
    else if (mx >= 265 && mx <= 380 && my >= 522 && my <= 555) {
      state = "CONFIRM_DELETE";
    }
    // [E] Mode (mx 390..505, my 522..555)
    else if (mx >= 390 && mx <= 505 && my >= 522 && my <= 555) {
      eduMode = (eduMode === "MATH" ? "VOCAB" : "MATH");
      savePlayerProfile();
      sfx.playCoin();
    }
    // [G] Garasi (mx 515..630, my 522..555)
    else if (mx >= 515 && mx <= 630 && my >= 522 && my <= 555) {
      state = "GARAGE";
    }
    // Tab Pilihan Edukasi (Matematika vs Vocab)
    else if (my >= 88 && my <= 120) {
      if (mx >= 190 && mx <= 385) {
        eduMode = "MATH"; savePlayerProfile(); sfx.playCoin();
      } else if (mx >= 415 && mx <= 610) {
        eduMode = "VOCAB"; savePlayerProfile(); sfx.playCoin();
      }
    }
    // Tab Pilihan Level (Matematika / Vocab)
    else if (my >= 124 && my <= 156) {
      if (mx >= 165 && mx <= 315) {
        if (eduMode === "MATH") { gradeLevel = 1; generateNewMathQuestion(); }
        else { vocabLevel = 1; generateNewVocabQuestion(); }
        savePlayerProfile();
        sfx.playCoin();
      } else if (mx >= 325 && mx <= 475) {
        if (eduMode === "MATH") { gradeLevel = 2; generateNewMathQuestion(); }
        else { vocabLevel = 2; generateNewVocabQuestion(); }
        savePlayerProfile();
        sfx.playCoin();
      } else if (mx >= 485 && mx <= 635) {
        if (eduMode === "MATH") { gradeLevel = 3; generateNewMathQuestion(); }
        else { vocabLevel = 3; generateNewVocabQuestion(); }
        savePlayerProfile();
        sfx.playCoin();
      }
    }
    // 1. Tab Mobil
    else if (mx >= 190 && mx <= 390 && my >= 155 && my <= 192) {
      garageIdx = carKeys.findIndex(k => CARS_DATA[k].type === "car");
      selectedCarKey = carKeys[garageIdx];
      savePlayerProfile();
    }
    // 2. Tab Tank
    else if (mx >= 410 && mx <= 610 && my >= 155 && my <= 192) {
      garageIdx = carKeys.findIndex(k => CARS_DATA[k].type === "tank");
      selectedCarKey = carKeys[garageIdx];
      savePlayerProfile();
    }
    // 3. Tombol Panah Kiri (◀)
    else if (mx >= 120 && mx <= 180 && my >= 240 && my <= 325) {
      garageIdx = (garageIdx - 1 + carKeys.length) % carKeys.length;
      selectedCarKey = carKeys[garageIdx];
      savePlayerProfile();
    }
    // 4. Tombol Panah Kanan (▶) atau Kartu
    else if ((mx >= 620 && mx <= 680 && my >= 240 && my <= 325) || (mx >= 190 && mx <= 610 && my >= 200 && my <= 405)) {
      garageIdx = (garageIdx + 1) % carKeys.length;
      selectedCarKey = carKeys[garageIdx];
      savePlayerProfile();
    }
    // 5. Tombol Mulai
    else if (mx >= 220 && mx <= 580 && my >= 460 && my <= 525) {
      startNewGame();
    }
    // 6. Tombol Garasi
    else if (mx >= 220 && mx <= 580 && my >= 530 && my <= 575) {
      state = "GARAGE";
    }
  } else if (state === "GARAGE") {
    // 5 Kartu Kendaraan di Garasi
    const cardW = 140, gap = 12;
    const startX = Math.floor((800 - (carKeys.length * cardW + (carKeys.length - 1) * gap)) / 2);
    for (let i = 0; i < carKeys.length; i++) {
      const cx = startX + i * (cardW + gap);
      if (mx >= cx && mx <= cx + cardW && my >= 110 && my <= 480) {
        garageIdx = i;
        selectedCarKey = carKeys[garageIdx];
        savePlayerProfile();
        break;
      }
    }
    // Tombol Mulai di Garasi
    if (mx >= 240 && mx <= 560 && my >= 490 && my <= 560) {
      startNewGame();
    }
  } else if (state === "GAMEOVER") {
    startNewGame();
  }
});

function handleKeyPress(k) {
  if (state !== "NAME_INPUT" && (k.toLowerCase() === "f")) {
    toggleFullScreen();
    return;
  }
  if (state === "NAME_INPUT") {
    if (k === "Enter") {
      playerName = inputNameText.trim() || "Khansa";
      savePlayerProfile();
      state = "MENU";
      sfx.playCoin();
    } else if (k === "Backspace") {
      inputNameText = inputNameText.slice(0, -1);
    } else if (k === "Escape") {
      if (playerName) state = "MENU";
    } else if (k.length === 1 && inputNameText.length < 15) {
      inputNameText += k;
    }
  } else if (state === "CONFIRM_DELETE") {
    if (k.toLowerCase() === "y" || k === "Enter") {
      deletePlayerProfile();
      sfx.playCrash();
    } else if (k.toLowerCase() === "n" || k === "Escape") {
      state = "MENU";
    }
  } else if (state === "MENU") {
    if (k === " " || k === "Enter") startNewGame();
    if (k.toLowerCase() === "n") {
      inputNameText = playerName;
      state = "NAME_INPUT";
      sfx.playCoin();
    }
    if (k === "Delete" || k.toLowerCase() === "delete") {
      state = "CONFIRM_DELETE";
    }
    if (k.toLowerCase() === "e") {
      eduMode = (eduMode === "MATH" ? "VOCAB" : "MATH");
      savePlayerProfile();
      sfx.playCoin();
    }
    if (k === "1") {
      if (eduMode === "MATH") { gradeLevel = 1; generateNewMathQuestion(); }
      else { vocabLevel = 1; generateNewVocabQuestion(); }
      savePlayerProfile();
      sfx.playCoin();
    }
    if (k === "2") {
      if (eduMode === "MATH") { gradeLevel = 2; generateNewMathQuestion(); }
      else { vocabLevel = 2; generateNewVocabQuestion(); }
      savePlayerProfile();
      sfx.playCoin();
    }
    if (k === "3") {
      if (eduMode === "MATH") { gradeLevel = 3; generateNewMathQuestion(); }
      else { vocabLevel = 3; generateNewVocabQuestion(); }
      savePlayerProfile();
      sfx.playCoin();
    }
    if (k === "ArrowLeft") {
      garageIdx = (garageIdx - 1 + carKeys.length) % carKeys.length;
      selectedCarKey = carKeys[garageIdx];
      savePlayerProfile();
    }
    if (k === "ArrowRight") {
      garageIdx = (garageIdx + 1) % carKeys.length;
      selectedCarKey = carKeys[garageIdx];
      savePlayerProfile();
    }
    if (k.toLowerCase() === "t") {
      garageIdx = carKeys.findIndex(key => CARS_DATA[key].type === "tank");
      selectedCarKey = carKeys[garageIdx];
      savePlayerProfile();
    }
    if (k.toLowerCase() === "c") {
      garageIdx = carKeys.findIndex(key => CARS_DATA[key].type === "car");
      selectedCarKey = carKeys[garageIdx];
      savePlayerProfile();
    }
    if (k.toLowerCase() === "g") state = "GARAGE";
  } else if (state === "GARAGE") {
    if (k === "ArrowLeft") garageIdx = (garageIdx - 1 + carKeys.length) % carKeys.length;
    if (k === "ArrowRight") garageIdx = (garageIdx + 1) % carKeys.length;
    selectedCarKey = carKeys[garageIdx];
    savePlayerProfile();
    if (k === " " || k === "Enter") startNewGame();
    if (k === "Escape") state = "MENU";
  } else if (state === "PLAYING") {
    if (k.toLowerCase() === "p" || k === "Escape") {
      state = "PAUSED";
      sfx.stopEngine();
    }
    if (k.toLowerCase() === "b") sfx.toggleBgm();
  } else if (state === "PAUSED") {
    if (k.toLowerCase() === "p" || k === "Escape") state = "PLAYING";
    if (k.toLowerCase() === "m") {
      sfx.stopEngine();
      state = "MENU";
    }
  } else if (state === "GAMEOVER") {
    if (k === " " || k === "Enter" || k.toLowerCase() === "r") startNewGame();
    if (k.toLowerCase() === "m") {
      sfx.stopEngine();
      state = "MENU";
    }
    if (k.toLowerCase() === "g") {
      sfx.stopEngine();
      state = "GARAGE";
    }
  }
}

// Player Vehicle Class (Mobil & Tank)
class Player {
  constructor(carKey) {
    this.key = carKey;
    this.data = CARS_DATA[carKey];
    this.type = this.data.type || "car";
    this.w = this.type === "tank" ? 48 : 42;
    this.h = 76;
    this.x = (ROAD_LEFT + ROAD_RIGHT) / 2;
    this.defaultY = 515;
    this.y = this.defaultY;
    this.speed = 0;
    this.hp = this.data.maxHp;
    this.maxHp = this.data.maxHp;
    this.nitro = this.data.nitroDuration || 150;
    this.maxNitro = this.data.nitroDuration || 150;
    this.isNitro = false;
    this.coins = playerCoins;
    this.playerName = playerName || "Khansa";
    this.angle = 0;
    this.invul = 0;
    this.superShieldTimer = 0;
    this.superShieldAnim = 0;
    this.slip = 0;
    this.slipDir = 1;
    this.particles = [];
    this.shells = [];
    this.shootTimer = 0;
    this.muzzleTimer = 0;
    this.treadScroll = 0;
  }

  update() {
    const isGas = keys['ArrowUp'] || keys['KeyW'];
    const isBrake = keys['ArrowDown'] || keys['KeyS'];
    const isLeft = keys['ArrowLeft'] || keys['KeyA'];
    const isRight = keys['ArrowRight'] || keys['KeyD'];
    const isSpecialKey = keys[' '] || keys['Space'] || keys['Shift'];

    // 1. Aksi Spesial: Tembak Meriam (Tank) ATAU Turbo Nitro (Mobil)
    if (this.type === "tank") {
      if (isSpecialKey && this.shootTimer <= 0) {
        this.shells.push({
          x: this.x,
          y: this.y - this.h / 2 - 14,
          vy: -18,
          life: 45,
          isPlasma: (this.key === "titan_khansa")
        });
        this.shootTimer = this.data.cannonCooldown || 20;
        this.muzzleTimer = 5;
        this.y += 2; // Recoil hentakan tembakan
        sfx.playCannon();
      }
      if (this.shootTimer > 0) this.shootTimer--;
      if (this.muzzleTimer > 0) this.muzzleTimer--;
      this.isNitro = false;
    } else {
      // Mobil Balap: Turbo Nitro
      if (isSpecialKey && this.nitro > 0 && this.speed > 3) {
        this.isNitro = true;
        this.nitro = Math.max(0, this.nitro - 1.2);
      } else {
        this.isNitro = false;
        if (this.nitro < this.maxNitro && this.speed > 5) {
          this.nitro = Math.min(this.maxNitro, this.nitro + 0.1);
        }
      }
    }

    const curMaxSpeed = this.isNitro ? this.data.maxSpeed * 1.35 : this.data.maxSpeed;
    const curAccel = this.isNitro ? this.data.accel * 1.8 : this.data.accel;

    const maxReverseSpeed = (this.type === "tank") ? -4.0 : -5.0;

    if (this.slip > 0) {
      this.slip--;
      this.x += this.slipDir * (this.type === "tank" ? 2.2 : 3.5);
      this.angle = Math.sin(this.slip * 0.4) * (this.type === "tank" ? 0.2 : 0.35);
      this.speed = Math.max(3, this.speed * 0.98);
    } else {
      if (isGas) {
        if (this.speed < 0) {
          // Rem saat mundur
          this.speed = Math.min(0, this.speed + curAccel * 2.0);
        } else {
          this.speed = Math.min(curMaxSpeed, this.speed + curAccel);
        }
      } else if (isBrake) {
        if (this.speed > 0) {
          // Rem saat maju
          this.speed = Math.max(0, this.speed - curAccel * 2.5);
        } else {
          // Masuk gigi mundur
          this.speed = Math.max(maxReverseSpeed, this.speed - curAccel * 0.8);
        }
      } else {
        // Hambatan gesekan jalan normal
        if (this.speed > 0) {
          this.speed = Math.max(0, this.speed - 0.08);
        } else if (this.speed < 0) {
          this.speed = Math.min(0, this.speed + 0.12);
        }
      }

      // Belok responsif: tidak perlu gas, tetap dapat berbelok saat diam atau meluncur
      let targetAngle = 0;
      const steerFactor = Math.max(0.85, Math.min(1.0, Math.abs(this.speed) / 4.0));
      const maxSteer = (this.type === "tank" ? 0.08 : 0.15);
      if (isLeft) {
        this.x -= this.data.handling * steerFactor;
        targetAngle = -maxSteer;
      }
      if (isRight) {
        this.x += this.data.handling * steerFactor;
        targetAngle = maxSteer;
      }
      this.angle += (targetAngle - this.angle) * 0.25;
    }

    // Boundary horizontal
    const minX = ROAD_LEFT + this.w / 2 + 6;
    const maxX = ROAD_RIGHT - this.w / 2 - 6;
    if (this.x < minX) { this.x = minX; this.speed = Math.max(2, this.speed * 0.9); }
    if (this.x > maxX) { this.x = maxX; this.speed = Math.max(2, this.speed * 0.9); }

    // Pemulihan posisi Y halus & pembatas batas bawah vertikal (agar mobil 100% selalu utuh terlihat!)
    this.y += (this.defaultY - this.y) * 0.08;
    const minY = 120;
    const maxY = 650 - this.h / 2 - 24;
    if (this.y < minY) this.y = minY;
    if (this.y > maxY) this.y = maxY;

    if (this.invul > 0) this.invul--;
    if (this.superShieldTimer > 0) {
      this.superShieldTimer--;
      this.superShieldAnim += 0.12;
      if (Math.random() < 0.6) {
        this.particles.push({
          x: this.x + (Math.random() - 0.5) * 36,
          y: this.y + (Math.random() - 0.5) * 36,
          vx: (Math.random() - 0.5) * 2,
          vy: Math.random() * 2 + 1,
          col: ['#ffd700', '#00e5ff', '#ff4081', '#2ecc71', '#ff9100'][Math.floor(Math.random() * 5)],
          size: Math.random() * 3 + 3,
          life: 18
        });
      }
    }
    this.treadScroll = (this.treadScroll + this.speed * 0.8) % 12;

    // Update Peluru Meriam Tank
    this.shells.forEach(s => { s.y += s.vy; s.life--; });
    this.shells = this.shells.filter(s => s.life > 0 && s.y > -50);

    // Particles
    if (this.speed > 2) {
      const by = this.y + this.h / 2;
      if (this.type === "tank") {
        if (Math.random() < 0.4) {
          this.particles.push({
            x: this.x + (Math.random() - 0.5) * 20, y: by + 2,
            vx: (Math.random() - 0.5) * 0.8, vy: Math.random() * 2 + 2,
            col: '#444', size: Math.random() * 3 + 2, life: 14
          });
        }
      } else {
        [-12, 12].forEach(ox => {
          if (this.isNitro) {
            this.particles.push({
              x: this.x + ox, y: by + 4,
              vx: (Math.random() - 0.5) * 1.5, vy: Math.random() * 3 + 4,
              col: ['#00e5ff', '#ff9100', '#ffeb3b', '#ffffff'][Math.floor(Math.random() * 4)],
              size: Math.random() * 3 + 3, life: 14
            });
          }
        });
      }
    }
    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; p.size *= 0.93; });
    this.particles = this.particles.filter(p => p.life > 0);
  }

  takeDamage(amt) {
    if (this.superShieldTimer > 0) return false;
    if (this.invul <= 0) {
      const actualDmg = (this.type === "tank") ? Math.floor(amt * 0.7) : amt;
      this.hp = Math.max(0, this.hp - actualDmg);
      this.invul = 60;
      this.speed = Math.max(2, this.speed * (this.type === "tank" ? 0.75 : 0.5));
      return true;
    }
    return false;
  }

  draw() {
    // Peluru Meriam Tank
    this.shells.forEach(s => {
      ctx.fillStyle = s.isPlasma ? '#00e5ff' : '#ffb703';
      ctx.beginPath();
      ctx.arc(s.x, s.y, 5, 0, Math.PI * 2);
      ctx.fill();
    });

    // Particles
    this.particles.forEach(p => {
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
      ctx.fill();
    });

    if (this.invul > 0 && Math.floor(this.invul / 6) % 2 === 1) return;

    // Headlight cone
    ctx.save();
    ctx.fillStyle = "rgba(255, 255, 220, 0.08)";
    [-14, 14].forEach(ox => {
      ctx.beginPath();
      ctx.moveTo(this.x + ox, this.y - this.h / 2);
      ctx.lineTo(this.x + ox - 35, this.y - this.h / 2 - 130);
      ctx.lineTo(this.x + ox + 35, this.y - this.h / 2 - 130);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    const hw = this.w / 2;
    const hh = this.h / 2;

    if (this.type === "tank") {
      // --- Render Tank Tempur ---
      // Bayangan
      ctx.fillStyle = 'rgba(10, 12, 15, 0.5)';
      ctx.beginPath();
      ctx.roundRect(-hw - 2, -hh + 3, this.w + 4, this.h + 3, 6);
      ctx.fill();

      // Roda Rantai (Treads) Kiri & Kanan
      const treadW = 10;
      [-hw, hw - treadW].forEach(tx => {
        ctx.fillStyle = '#1c1e20';
        ctx.beginPath();
        ctx.roundRect(tx, -hh, treadW, this.h, 4);
        ctx.fill();
        // Garis gerigi rantai
        ctx.fillStyle = '#444950';
        for (let y = -hh + (this.treadScroll % 10); y < hh; y += 10) {
          ctx.fillRect(tx + 1, y, treadW - 2, 2);
        }
      });

      // Bodi Lapis Baja Utama
      ctx.fillStyle = this.data.primary;
      ctx.beginPath();
      ctx.roundRect(-hw + 8, -hh + 4, this.w - 16, this.h - 8, 6);
      ctx.fill();

      // Corak Loreng Kamuflase
      ctx.fillStyle = this.data.stripe;
      ctx.fillRect(-hw + 10, -hh + 8, 12, 20);
      ctx.fillRect(0, 4, 12, 20);

      // Laras Meriam Panjang
      const barrelW = 6;
      const barrelLen = 32;
      ctx.fillStyle = '#374151';
      ctx.fillRect(-barrelW / 2, -hh - barrelLen + 10, barrelW, barrelLen);
      // Moncong meriam
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(-barrelW / 2 - 2, -hh - barrelLen + 6, barrelW + 4, 6);

      // Kubah Meriam Tengah (Turret)
      ctx.fillStyle = this.data.primary;
      ctx.beginPath();
      ctx.roundRect(-13, -15, 26, 30, 8);
      ctx.fill();
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Palka Komandan
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(0, 2, 5, 0, Math.PI * 2);
      ctx.fill();

      // Muzzle Flash Meriam
      if (this.muzzleTimer > 0) {
        ctx.fillStyle = (this.key === 'titan_khansa') ? '#00e5ff' : '#ffb703';
        ctx.beginPath();
        ctx.arc(0, -hh - barrelLen + 6, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, -hh - barrelLen + 6, 6, 0, Math.PI * 2);
        ctx.fill();
      }

    } else {
      // --- Render Mobil Balap ---
      ctx.fillStyle = 'rgba(10, 10, 15, 0.4)';
      ctx.beginPath();
      ctx.roundRect(-hw - 2, -hh + 4, this.w + 4, this.h + 2, 8);
      ctx.fill();

      // Tires
      ctx.fillStyle = '#222';
      [[-hw - 2, -hh + 8], [hw - 5, -hh + 8], [-hw - 2, hh - 22], [hw - 5, hh - 22]].forEach(([wx, wy]) => {
        ctx.beginPath();
        ctx.roundRect(wx, wy, 7, 15, 3);
        ctx.fill();
      });

      // Body
      ctx.fillStyle = this.data.primary;
      ctx.beginPath();
      ctx.roundRect(-hw, -hh, this.w, this.h, 9);
      ctx.fill();

      // Racing stripe
      ctx.fillStyle = this.data.stripe;
      ctx.fillRect(-4, -hh + 2, 8, this.h - 4);

      // Windshield
      ctx.fillStyle = '#1c2838';
      ctx.beginPath();
      ctx.roundRect(-hw + 5, -hh + 18, this.w - 10, 14, 3);
      ctx.fill();

      // Rear glass
      ctx.beginPath();
      ctx.roundRect(-hw + 6, hh - 24, this.w - 12, 10, 3);
      ctx.fill();

      // Headlights & Taillights
      ctx.fillStyle = '#ffffe0';
      ctx.fillRect(-hw + 3, -hh + 2, 7, 3);
      ctx.fillRect(hw - 10, -hh + 2, 7, 3);
      ctx.fillStyle = (this.speed < -0.2) ? '#ffffff' : '#ff2222';
      ctx.fillRect(-hw + 3, hh - 4, 7, 3);
      ctx.fillRect(hw - 10, hh - 4, 7, 3);
    }
    ctx.restore();

    // Gambar Super Shield Bintang Pelangi jika aktif
    if (this.superShieldTimer > 0) {
      const radius = Math.max(this.w, this.h) / 2 + 14;
      const hue = Math.floor((this.superShieldAnim * 45) % 360);
      ctx.save();
      ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
      ctx.lineWidth = 4;
      ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(this.x, this.y, radius - 3, 0, Math.PI * 2);
      ctx.stroke();

      // 3 Bintang Berputar Mengorbit Kendaraan
      const numStars = 3;
      const orbitR = radius + 8;
      for (let i = 0; i < numStars; i++) {
        const angle = this.superShieldAnim + i * (Math.PI * 2 / numStars);
        const sx = this.x + Math.cos(angle) * orbitR;
        const sy = this.y + Math.sin(angle) * orbitR;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(sx, sy, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sx, sy, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }
}

// World state
let player = new Player(selectedCarKey);
let traffic = [];
let items = [];
let hazards = [];
let explosions = [];
let spawnTrafficTimer = 0;
let spawnItemTimer = 0;
let spawnHazardTimer = 0;

function startNewGame() {
  sfx.init();
  player = new Player(selectedCarKey);
  traffic = [];
  items = [];
  hazards = [];
  explosions = [];
  confettiParticles = [];
  celebrationBannerTimer = 0;
  score = 0;
  distance = 0;
  isNewRecord = false;
  state = "PLAYING";

  // Reset Modul Edukasi Matematika & Kosa Kata
  mathTotalQuestions = 0;
  mathCorrectAnswers = 0;
  mathCurrentStreak = 0;
  mathBestStreak = 0;
  mathActiveGate = null;
  mathFeedbackTimer = 0;
  mathSpawnTimer = 180;
  generateNewMathQuestion();

  vocabTotalQuestions = 0;
  vocabCorrectAnswers = 0;
  vocabCurrentStreak = 0;
  vocabBestStreak = 0;
  vocabActiveGate = null;
  vocabFeedbackTimer = 0;
  vocabSpawnTimer = 180;
  generateNewVocabQuestion();

  // Update Touch button icon
  const nBtn = document.getElementById('btn-nitro');
  if (nBtn) {
    nBtn.innerText = player.type === 'tank' ? '💣' : '⚡';
  }
}

function getBiome(dist) {
  const c = Math.floor(dist / 1500) % 3;
  return c === 0 ? "green" : (c === 1 ? "desert" : "cyber");
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function update() {
  if (state !== "PLAYING") return;

  player.update();

  const isGas = keys['ArrowUp'] || keys['KeyW'];
  const isBrake = keys['ArrowDown'] || keys['KeyS'];
  sfx.updateEngine(player.speed, player.data.maxSpeed, player.isNitro, isGas, isBrake, player.type);

  if (Math.abs(player.angle) > 0.08 && player.speed > 5) {
    sfx.playScreech();
  }

  distance += player.speed * 0.45;
  scrollY = (scrollY + player.speed) % 80;

  if (player.speed > 0.5) {
    score += Math.floor(player.speed * (player.isNitro ? 1.8 : 1.0));
  }

  // Update Peluru Meriam & Deteksi Benturan Hancur
  for (let i = player.shells.length - 1; i >= 0; i--) {
    const s = player.shells[i];
    let shellHit = false;

    // 1. Tembak Mobil Lalu Lintas
    for (let j = traffic.length - 1; j >= 0; j--) {
      const t = traffic[j];
      if (Math.abs(s.x - t.x) < (t.type.w / 2 + 10) && Math.abs(s.y - t.y) < (t.type.h / 2 + 10)) {
        explosions.push({
          x: t.x, y: t.y,
          radius: 8, maxRadius: 36,
          life: 20, maxLife: 20,
          color: s.isPlasma ? '#00e5ff' : '#ff7700'
        });
        sfx.playExplosion();
        traffic.splice(j, 1);
        score += 150;
        shellHit = true;
        break;
      }
    }

    // 2. Tembak Hambatan Jalan
    if (!shellHit) {
      for (let j = hazards.length - 1; j >= 0; j--) {
        const h = hazards[j];
        if (Math.abs(s.x - h.x) < (h.w / 2 + 10) && Math.abs(s.y - h.y) < (h.h / 2 + 10)) {
          explosions.push({
            x: h.x, y: h.y,
            radius: 8, maxRadius: 30,
            life: 18, maxLife: 18,
            color: s.isPlasma ? '#00e5ff' : '#ff9900'
          });
          sfx.playExplosion();
          hazards.splice(j, 1);
          score += 100;
          shellHit = true;
          break;
        }
      }
    }

    if (shellHit) {
      player.shells.splice(i, 1);
    }
  }

  // Update Partikel Ledakan
  explosions.forEach(ex => {
    ex.y += player.speed;
    ex.life--;
    ex.radius += (ex.maxRadius - ex.radius) * 0.16;
  });
  explosions = explosions.filter(ex => ex.life > 0);

  // Spawners
  spawnTrafficTimer++;
  if (spawnTrafficTimer >= 65) {
    spawnTrafficTimer = 0;
    const lane = Math.floor(Math.random() * NUM_LANES);
    const type = TRAFFIC_TYPES[Math.floor(Math.random() * TRAFFIC_TYPES.length)];
    traffic.push({
      lane, x: LANE_CENTERS[lane], y: -100,
      type, speed: type.speed, passed: false
    });
  }

  spawnItemTimer++;
  if (spawnItemTimer >= 55) {
    spawnItemTimer = 0;
    const lane = Math.floor(Math.random() * NUM_LANES);
    const lx = LANE_CENTERS[lane];
    const r = Math.random();
    if (r < 0.65) {
      for (let i = 0; i < 3; i++) items.push({ type: 'coin', x: lx, y: -40 - i * 36, r: 12 });
    } else if (r < 0.85) {
      items.push({ type: 'nitro', x: lx, y: -50, w: 22, h: 34 });
    } else {
      items.push({ type: 'repair', x: lx, y: -50, w: 26, h: 26 });
    }
  }

  spawnHazardTimer++;
  if (spawnHazardTimer >= 105) {
    spawnHazardTimer = 0;
    const lane = Math.floor(Math.random() * NUM_LANES);
    const lx = LANE_CENTERS[lane];
    if (Math.random() < 0.6) {
      hazards.push({ type: 'oil', x: lx, y: -60, w: 50, h: 32 });
    } else {
      hazards.push({ type: 'block', x: lx, y: -60, w: 60, h: 22 });
    }
  }

  // Update Traffic
  traffic.forEach(t => {
    t.y += (player.speed - t.speed);
    if (!t.passed && t.y > player.y) {
      t.passed = true;
      if (Math.abs(t.x - player.x) < 55) score += 50; // Close pass bonus
    }
    // Collision
    if (Math.abs(t.x - player.x) < (t.type.w + player.w) / 2 - 6 &&
        Math.abs(t.y - player.y) < (t.type.h + player.h) / 2 - 8) {
      if (player.superShieldTimer > 0) {
        // SUPER SMASH! Hancurkan mobil musuh saat perisai kebal aktif
        t.y = 9999;
        explosions.push({
          x: t.x, y: player.y - 20,
          radius: 10, maxRadius: 40,
          life: 22, maxLife: 22,
          color: '#ff4081'
        });
        sfx.playExplosion();
        score += 250;
        player.coins += 2;
      } else if (player.takeDamage(25)) {
        sfx.playCrash();
        t.y -= 25;
      }
    }
  });

  // Magnet Koin saat Super Shield aktif
  if (player.superShieldTimer > 0) {
    items.forEach(it => {
      const dx = player.x - it.x;
      const dy = player.y - it.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 260 && dist > 5) {
        it.x += dx * 0.16;
        it.y += dy * 0.16;
      }
    });
  }

  // Update Items
  items.forEach(it => {
    it.y += player.speed;
    const hitW = it.type === 'coin' ? it.r * 2 : it.w;
    const hitH = it.type === 'coin' ? it.r * 2 : it.h;
    if (!it.collected && Math.abs(it.x - player.x) < (hitW + player.w) / 2 &&
        Math.abs(it.y - player.y) < (hitH + player.h) / 2) {
      it.collected = true;
      if (it.type === 'coin') {
        player.coins++; score += 100; sfx.playCoin();
      } else if (it.type === 'nitro') {
        player.nitro = Math.min(player.maxNitro, player.nitro + 70); sfx.playNitro();
      } else if (it.type === 'repair') {
        player.hp = Math.min(player.maxHp, player.hp + 35); sfx.playRepair();
      }
    }
  });

  // Update Hazards
  hazards.forEach(h => {
    h.y += player.speed;
    if (Math.abs(h.x - player.x) < (h.w + player.w) / 2 - 4 &&
        Math.abs(h.y - player.y) < (h.h + player.h) / 2 - 4) {
      if (player.superShieldTimer > 0) {
        if (h.type === 'block') {
          h.y = 9999;
          explosions.push({
            x: h.x, y: h.y,
            radius: 8, maxRadius: 30,
            life: 18, maxLife: 18,
            color: '#ffd700'
          });
          sfx.playExplosion();
          score += 100;
        }
      } else {
        if (h.type === 'oil') {
          player.slip = 35;
          player.slipDir = Math.random() < 0.5 ? -1 : 1;
        } else if (h.type === 'block') {
          if (player.takeDamage(35)) sfx.playCrash();
        }
      }
    }
  });

  // Filter offscreen
  traffic = traffic.filter(t => t.y < 750 && t.y > -250);
  items = items.filter(it => it.y < 720 && !it.collected);
  hazards = hazards.filter(h => h.y < 720);

  // Update Modul Edukasi Matematika (Gerbang Jawaban)
  if (mathFeedbackTimer > 0) mathFeedbackTimer--;
  if (vocabFeedbackTimer > 0) vocabFeedbackTimer--;

  if (eduMode === "VOCAB") {
    // Spawner & Update Gerbang Kosa Kata Inggris
    if (vocabActiveGate === null) {
      vocabSpawnTimer++;
      // Setengah jalan menuju gerbang berikutnya: Munculkan soal baru jauh sebelum gerbang tiba!
      if (vocabSpawnTimer === Math.floor(vocabSpawnInterval / 2)) {
        generateNewVocabQuestion();
      }
      if (vocabSpawnTimer >= vocabSpawnInterval) {
        vocabSpawnTimer = 0;
        if (!vocabCurrentQuestion) generateNewVocabQuestion();
        vocabActiveGate = {
          question: vocabCurrentQuestion,
          y: -90,
          resolved: false
        };
      }
    } else {
      vocabActiveGate.y += player.speed;

      if (!vocabActiveGate.resolved && Math.abs(player.y - vocabActiveGate.y) < 32) {
        let closestLane = 0;
        let minDist = 9999;
        for (let i = 0; i < LANE_CENTERS.length; i++) {
          const d = Math.abs(player.x - LANE_CENTERS[i]);
          if (d < minDist) {
            minDist = d;
            closestLane = i;
          }
        }

        if (minDist < (LANE_WIDTH / 2 - 2)) {
          const chosenVal = vocabActiveGate.question.options[closestLane];
          const isCorrect = (chosenVal === vocabActiveGate.question.correctAnswer);

          if (isCorrect) {
            vocabActiveGate.resolved = true;
            vocabTotalQuestions++;
            vocabCorrectAnswers++;
            vocabCurrentStreak++;
            vocabBestStreak = Math.max(vocabBestStreak, vocabCurrentStreak);
            score += 500;
            sfx.playVictoryFanfare();
            sfx.playCoinCascade();
            sfx.playMathCorrect();

            player.superShieldTimer = 420;
            player.coins += 35;
            player.hp = Math.min(player.maxHp, player.hp + 50);

            if (player.type === "tank") {
              player.shootTimer = 0;
              player.speed = Math.min(player.data.maxSpeed * 1.25, player.speed + 4.0);
            } else {
              player.nitro = player.maxNitro;
              player.speed = Math.min(player.data.maxSpeed * 1.35, player.speed + 5.0);
            }

            masteredWords.add(vocabActiveGate.question.sourceWord.toLowerCase());
            savePlayerProfile();
            lastQuote = getRandomQuote();

            spawnConfettiBurst();
            celebrationBannerTimer = 340;
            lastMotivation = getRandomMotivation(playerName);

            const praise = lastMotivation;
            const streakTxt = vocabCurrentStreak > 1 ? ` 🔥 Streak x${vocabCurrentStreak}` : "";
            vocabFeedbackText = `🎁 ${praise} '${vocabActiveGate.question.sourceWord}' = '${vocabActiveGate.question.correctAnswer}' (📚 ${masteredWords.size}/3000 KATA)${streakTxt}`;
            vocabFeedbackColor = "#2ecc71";
            vocabFeedbackTimer = 150;
          } else {
            // TIDAK BISA LEWAT! Terblokir & terpental mundur
            vocabCurrentStreak = 0;
            if (!vocabActiveGate.blockedLanes) vocabActiveGate.blockedLanes = {};
            vocabActiveGate.blockedLanes[closestLane] = 35;
            const maxSafeY = 650 - player.h / 2 - 24;
            player.y = Math.min(maxSafeY, Math.max(player.y, vocabActiveGate.y + 42));
            player.speed = -3.5;
            sfx.playBarrierBlock();
            vocabFeedbackText = `⛔ ARTINYA SALAH! LAJUR TERBLOKIR! '${vocabActiveGate.question.sourceWord}' ≠ '${chosenVal}'. Belok cari arti yang benar!`;
            vocabFeedbackColor = "#ff4d4d";
            vocabFeedbackTimer = 90;
          }
        }
      }

      if (vocabActiveGate.blockedLanes) {
        for (const k in vocabActiveGate.blockedLanes) {
          vocabActiveGate.blockedLanes[k]--;
          if (vocabActiveGate.blockedLanes[k] <= 0) delete vocabActiveGate.blockedLanes[k];
        }
      }
      vocabActiveGate.animTick = (vocabActiveGate.animTick || 0) + 1;

      if (vocabActiveGate.y > 720) {
        if (!vocabActiveGate.resolved) {
          vocabFeedbackText = `Terlewat! '${vocabActiveGate.question.sourceWord}' = '${vocabActiveGate.question.correctAnswer}'`;
          vocabFeedbackColor = "#f59e0b";
          vocabFeedbackTimer = 90;
        }
        vocabActiveGate = null;
      }
    }
  } else {
    // Spawner & Update Gerbang Matematika SD
    if (mathActiveGate === null) {
      mathSpawnTimer++;
      // Setengah jalan menuju gerbang berikutnya: Munculkan soal baru jauh sebelum gerbang tiba!
      if (mathSpawnTimer === Math.floor(mathSpawnInterval / 2)) {
        generateNewMathQuestion();
      }
      if (mathSpawnTimer >= mathSpawnInterval) {
        mathSpawnTimer = 0;
        if (!mathCurrentQuestion) generateNewMathQuestion();
        mathActiveGate = {
          question: mathCurrentQuestion,
          y: -90,
          resolved: false
        };
      }
    } else {
      mathActiveGate.y += player.speed;

      if (!mathActiveGate.resolved && Math.abs(player.y - mathActiveGate.y) < 32) {
        let closestLane = 0;
        let minDist = 9999;
        for (let i = 0; i < LANE_CENTERS.length; i++) {
          const d = Math.abs(player.x - LANE_CENTERS[i]);
          if (d < minDist) {
            minDist = d;
            closestLane = i;
          }
        }

        if (minDist < (LANE_WIDTH / 2 - 2)) {
          const chosenVal = mathActiveGate.question.options[closestLane];
          const isCorrect = (chosenVal === mathActiveGate.question.correctAnswer);

          if (isCorrect) {
            mathActiveGate.resolved = true;
            mathTotalQuestions++;
            mathCorrectAnswers++;
            mathCurrentStreak++;
            mathBestStreak = Math.max(mathBestStreak, mathCurrentStreak);
            score += 500;
            sfx.playVictoryFanfare();
            sfx.playCoinCascade();
            sfx.playMathCorrect();

            player.superShieldTimer = 420;
            player.coins += 35;
            player.hp = Math.min(player.maxHp, player.hp + 50);

            if (player.type === "tank") {
              player.shootTimer = 0;
              player.speed = Math.min(player.data.maxSpeed * 1.25, player.speed + 4.0);
            } else {
              player.nitro = player.maxNitro;
              player.speed = Math.min(player.data.maxSpeed * 1.35, player.speed + 5.0);
            }

            savePlayerProfile();
            lastQuote = getRandomQuote();

            spawnConfettiBurst();
            celebrationBannerTimer = 340;
            lastMotivation = getRandomMotivation(playerName);

            const praise = lastMotivation;
            const streakTxt = mathCurrentStreak > 1 ? ` 🔥 Streak x${mathCurrentStreak}` : "";
            mathFeedbackText = `🎁 ${praise} ${mathActiveGate.question.text.replace(' = ?', '')} = ${mathActiveGate.question.correctAnswer} (+500 PTS, SHIELD KEBAL & 35 KOIN!)${streakTxt}`;
            mathFeedbackColor = "#2ecc71";
            mathFeedbackTimer = 150;
          } else {
            // TIDAK BISA LEWAT! Terblokir & terpental mundur
            mathCurrentStreak = 0;
            if (!mathActiveGate.blockedLanes) mathActiveGate.blockedLanes = {};
            mathActiveGate.blockedLanes[closestLane] = 35;
            const maxSafeY = 650 - player.h / 2 - 24;
            player.y = Math.min(maxSafeY, Math.max(player.y, mathActiveGate.y + 42));
            player.speed = -3.5;
            sfx.playBarrierBlock();
            mathFeedbackText = `⛔ SALAH! LAJUR TERBLOKIR! ${mathActiveGate.question.text.replace(' = ?', '')} ≠ ${chosenVal}. Belok cari jawaban benar!`;
            mathFeedbackColor = "#ff4d4d";
            mathFeedbackTimer = 90;
          }
        }
      }

      if (mathActiveGate.blockedLanes) {
        for (const k in mathActiveGate.blockedLanes) {
          mathActiveGate.blockedLanes[k]--;
          if (mathActiveGate.blockedLanes[k] <= 0) delete mathActiveGate.blockedLanes[k];
        }
      }
      mathActiveGate.animTick = (mathActiveGate.animTick || 0) + 1;

      if (mathActiveGate.y > 720) {
        if (!mathActiveGate.resolved) {
          mathFeedbackText = `Terlewat! ${mathActiveGate.question.text.replace(' = ?', '')} = ${mathActiveGate.question.correctAnswer}`;
          mathFeedbackColor = "#f59e0b";
          mathFeedbackTimer = 90;
        }
        mathActiveGate = null;
      }
    }
  }

  // Update Confetti & Banner Timer
  confettiParticles.forEach(cp => {
    cp.x += cp.vx;
    cp.y += cp.vy;
    cp.angle += cp.rotSpeed;
    cp.life--;
  });
  confettiParticles = confettiParticles.filter(cp => cp.life > 0);
  if (celebrationBannerTimer > 0) {
    celebrationBannerTimer--;
    const curGate = (eduMode === "VOCAB") ? vocabActiveGate : mathActiveGate;
    // Hanya mulai memudarkan banner jika gerbang BARU yang belum diselesaikan mendekati pemain (y >= 280)
    if (curGate && !curGate.resolved && curGate.y >= 280) {
      celebrationBannerTimer = Math.min(celebrationBannerTimer, 25);
    }
  }

  // Game over
  if (player.hp <= 0) {
    sfx.stopEngine();
    sfx.playCrash();
    if (score > highscore) {
      highscore = score;
      isNewRecord = true;
    }
    playerCoins = player.coins;
    savePlayerProfile();
    state = "GAMEOVER";
  }
}

function draw() {
  cursorTimer++;

  const biome = getBiome(distance);

  // Ground color
  let groundCol = biome === "desert" ? "#d7a05f" : (biome === "cyber" ? "#120e20" : "#2a9134");
  let roadCol = biome === "desert" ? "#3c3230" : (biome === "cyber" ? "#1c1928" : "#2d3037");
  ctx.fillStyle = groundCol;
  ctx.fillRect(0, 0, 800, 650);

  // Asphalt
  ctx.fillStyle = roadCol;
  ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, 650);

  // Rumble curbs
  for (let y = -80; y < 700; y += 36) {
    const ay = y + (scrollY * 1.5) % 72;
    const isRed = Math.floor(ay / 36) % 2 === 0;
    ctx.fillStyle = isRed ? "#dc2828" : "#f0f0f0";
    ctx.fillRect(ROAD_LEFT - 12, ay, 12, 36);
    ctx.fillRect(ROAD_RIGHT, ay, 12, 36);
  }

  if (state === "NAME_INPUT") {
    scrollY = (scrollY + 2.0) % 80;
    drawNameInputModal();
    return;
  }
  if (state === "CONFIRM_DELETE") {
    drawConfirmDeleteModal();
    return;
  }

  // Dash lanes
  ctx.fillStyle = biome === "cyber" ? "#00e5ff" : "#ebebf0";
  for (let l = 1; l < NUM_LANES; l++) {
    const lx = ROAD_LEFT + l * LANE_WIDTH;
    for (let y = -80; y < 700; y += 76) {
      ctx.fillRect(lx - 2, y + scrollY % 76, 4, 42);
    }
  }

  // Hazards
  hazards.forEach(h => {
    if (h.type === 'oil') {
      ctx.fillStyle = 'rgba(20, 22, 28, 0.85)';
      ctx.beginPath();
      ctx.ellipse(h.x, h.y, h.w / 2, h.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#ff6b35';
      ctx.beginPath();
      ctx.roundRect(h.x - h.w / 2, h.y - h.h / 2, h.w, h.h, 4);
      ctx.fill();
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });

  // Items
  items.forEach(it => {
    if (it.type === 'coin') {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e6a100';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (it.type === 'nitro') {
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath();
      ctx.roundRect(it.x - it.w / 2, it.y - it.h / 2, it.w, it.h, 4);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.fillText('N2O', it.x - 10, it.y + 4);
    } else if (it.type === 'repair') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(it.x - it.w / 2, it.y - it.h / 2, it.w, it.h, 4);
      ctx.fill();
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(it.x - 3, it.y - 8, 6, 16);
      ctx.fillRect(it.x - 8, it.y - 3, 16, 6);
    }
  });

  // Gambar Gerbang Jawaban Edukasi (Matematika / Kosa Kata Inggris)
  const activeGate = (eduMode === "VOCAB") ? vocabActiveGate : mathActiveGate;
  if (activeGate && activeGate.y > -60 && activeGate.y < 700) {
    const gy = Math.floor(activeGate.y);
    const gTick = activeGate.animTick || 0;
    const pulse = 0.6 + 0.4 * Math.sin(gTick * 0.15);

    // Horizontal barrier line
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(ROAD_LEFT + 10, gy);
    ctx.lineTo(ROAD_RIGHT - 10, gy);
    ctx.stroke();

    // Overhead Gantry Signboard Langsung di Atas Gerbang
    const signW = ROAD_WIDTH - 20;
    const signH = 26;
    const signX = ROAD_LEFT + 10;
    const signY = gy - 44;

    // Tiang gantry
    ctx.fillStyle = '#475569';
    ctx.fillRect(ROAD_LEFT + 4, signY - 2, 6, 52);
    ctx.fillRect(ROAD_RIGHT - 10, signY - 2, 6, 52);

    ctx.fillStyle = 'rgba(15, 22, 38, 0.94)';
    ctx.beginPath();
    ctx.roundRect(signX, signY, signW, signH, 6);
    ctx.fill();
    ctx.strokeStyle = (eduMode === "VOCAB") ? '#ffd700' : '#00e5ff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = (eduMode === "VOCAB") ? '#ffd700' : '#00e5ff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    const gantryText = (eduMode === "VOCAB")
      ? `🔤 ARTI KATA: "${activeGate.question.sourceWord.toUpperCase()}"`
      : `📐 SOAL: ${activeGate.question.text.replace(' = ?', '')} = ?`;
    ctx.fillText(gantryText, 400, signY + 18);
    ctx.textAlign = 'left';

    for (let i = 0; i < NUM_LANES; i++) {
      const cx = LANE_CENTERS[i];
      const val = String(activeGate.question.options[i]);
      const pw = LANE_WIDTH - 14;
      const ph = 44;
      const px = cx - pw / 2;
      const py = gy - ph / 2;

      const isBlocked = activeGate.blockedLanes && activeGate.blockedLanes[i] > 0;

      if (isBlocked) {
        // ─── RED BLOCKED LANE (Terbentur karena jawaban salah) ───
        ctx.fillStyle = 'rgba(180, 20, 20, 0.90)';
        ctx.beginPath();
        ctx.roundRect(px, py, pw, ph, 8);
        ctx.fill();

        ctx.strokeStyle = '#ff2222';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Garis silang laser perisai
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px + 8, py + 8);
        ctx.lineTo(px + pw - 8, py + ph - 8);
        ctx.moveTo(px + pw - 8, py + 8);
        ctx.lineTo(px + 8, py + ph - 8);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#ffaaaa';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⛔ SALAH', cx, py + ph + 14);
        ctx.textAlign = 'left';

      } else {
        // ─── PORTAL SERAGAM & NETRAL (TANPA PETUNJUK) ───
        // Bebas petunjuk: Semua portal terlihat sama persis agar user berpikir & memilih sendiri
        ctx.fillStyle = 'rgba(16, 24, 42, 0.94)';
        ctx.beginPath();
        ctx.roundRect(px, py, pw, ph, 8);
        ctx.fill();

        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(px, py, pw, ph, 8);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        if (val.length > 12) {
          ctx.font = 'bold 12px sans-serif';
        } else if (val.length > 8) {
          ctx.font = 'bold 15px sans-serif';
        } else {
          ctx.font = 'bold 18px sans-serif';
        }
        ctx.textAlign = 'center';
        ctx.fillText(val, cx, py + 28);
        ctx.textAlign = 'left';
      }
    }
  }

  // Traffic
  traffic.forEach(t => {
    ctx.save();
    ctx.translate(t.x, t.y);

    ctx.beginPath();
    ctx.roundRect(-t.type.w / 2, -t.type.h / 2, t.type.w, t.type.h, 6);

    ctx.fillStyle = t.type.roof;
    ctx.beginPath();
    ctx.roundRect(-t.type.w / 2 + 4, -t.type.h / 2 + 18, t.type.w - 8, 20, 3);
    ctx.fill();
    ctx.restore();
  });

  explosions.forEach(ex => {

    ctx.globalAlpha = alpha;
    ctx.fillStyle = ex.color;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.radius * 0.45, 0, Math.PI * 2);

    ctx.restore();

  if (state === "PLAYING" || state === "PAUSED") {
